workday_settings:
  # Broad terms; titles are then filtered with ats_title_filter below
  search_terms: [analyst, product, compliance]
  max_pages_per_term: 4       # 20 postings per page
  max_new_details: 80         # per company per run; the rest are picked up next run

# Company boards list every role, so keep only titles containing one of these.
# (Adzuna results are already scoped by the search queries above.)
ats_title_filter:
  - analyst
  - analytics
  - data
  - insights
  - business intelligence
  - scientist
  - risk
  - sales operations
  - revenue operations
  - product manager
  - product owner
  - product associate
  - associate product
  - product operations
  - aml
  - kyc
  - financial crime
  - compliance
  - fraud

# Keep only postings whose location contains one of these (case-insensitive).
# "Remote (Canada)" matches "canada"; plain US-remote roles are dropped.
location_filter:
  - toronto
  - ontario
  - canada
  - mississauga
  - ottawa
  - waterloo
  - kitchener
