# What to search. Edit this file to change the radar's scope.

adzuna:
  where: Toronto
  pages_per_query: 2        # 50 results per page
  max_days_old: 30
  title_only: true          # match search terms in the job title only (more precise)
  queries:
    - data analyst
    - product analyst
    - business analyst
    - business intelligence analyst
    - analytics new grad
    - risk analyst
    # Client / sales / business insights
    - insights analyst
    - client insights analyst
    - customer insights analyst
    - business insights analyst
    - sales analyst
    - sales operations analyst
    # Product management
    - product manager
    - associate product manager
    - product owner
    # AML / financial crime
    - aml analyst
    - kyc analyst
    - financial crime analyst
    - compliance analyst

# Target companies on public ATS boards (official public APIs, full job descriptions).
# The token is the slug in the company's careers URL. Verified October 2026;
# companies switch ATS vendors, so a board that starts failing is skipped with a note.
greenhouse:
  - {token: tenstorrent, company: Tenstorrent}
  - {token: instacart, company: Instacart}
  - {token: faire, company: Faire}
  - {token: geotab, company: Geotab}
  - {token: hootsuite, company: Hootsuite}
  - {token: shakepay, company: Shakepay}
lever:
  - {company: applydigital, display: Apply Digital}
  - {company: achievers, display: Achievers}
  - {company: waabi, display: Waabi}
  - {company: kepler, display: Kepler Communications}
  - {company: fullscript, display: Fullscript}
  - {company: riocan, display: RioCan}
  - {company: eqbank, display: EQ Bank}
  - {company: waveapps, display: Wave Financial}
ashby:
  - {org: wealthsimple, company: Wealthsimple}
  - {org: cohere, company: Cohere}
